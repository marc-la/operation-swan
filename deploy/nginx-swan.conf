# Team dashboard (todo/09). deploy/dash_setup.sh fills in HOST and copies this to /etc/nginx/conf.d/swan.conf.
# Static files only: no proxy, no CGI, no directory listing. Every path needs the password except robots.txt
# and the Let's Encrypt challenge.
limit_req_zone $binary_remote_addr zone=swan:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name HOST;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name HOST;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/swan;
    index index.html;
    autoindex off;
    limit_req zone=swan burst=20 nodelay;      # also slows password guessing
    auth_basic "Swan";
    auth_basic_user_file /etc/nginx/swan.htpasswd;

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location = /robots.txt { auth_basic off; }
    location / { try_files $uri $uri/ =404; }      # $uri/ lets "/" fall through to index.html
}
