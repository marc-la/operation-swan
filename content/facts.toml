# The in-game facts our prompts may state (todo/16). One table per fact; the key is how code refers to it
# (FRAMES[*]["facts"] and every `requires=` list in src/swan_bot/content.py).
#
#   text     the fact, true in-game, at most 200 characters (the copy check runs drafts against it)
#   note     the same fact as a terse note, at most 120 characters: this is what the prompts show
#   status   "active", or "paused" to keep it out of every prompt (and drop whatever requires it)
#   source   where it is true: "setting.md" or "<site>/<article slug>" on sites.legitreal.com
#   checked  when a human last checked it against the papers. A fact desk pause (data/facts_paused.json) holds
#            until this is later than the pause: scripts/facts_review.py stamps it
#   numbers  extra figures this fact makes true, if its text doesn't show them (the number gate allows every
#            figure in an active fact's text and numbers on top of quality.ALLOWED_NUMBERS)
#   says     regexes (case-insensitive) for wording that states this fact. While the fact is paused, prompt text
#            that matches is left out and the quality gate rejects drafts that match. Literal strings: write an
#            apostrophe as .? (no ' inside '...')
#   frames   (optional) frames that may use this fact on top of their own list in content.py
#
# Only humans edit this file, through scripts/facts_review.py or by hand. tests/test_facts.py runs on every deploy
# (deploy/check.sh), so an edit that breaks a rule never goes live. Never put a day or date for the vote here.

# Claims that are false in-game whatever the facts say. No fact, frame, catchphrase or character line may match
# one, and the quality gate rejects any draft that does. Add one when the news makes a claim false for good.
false_claims = [
    # 21 Oct, Daily Kingstonia: the first H2D2 case is confirmed (a traveller, in isolation)
    '\bno (confirmed |known |reported |recorded )?(h2d2 |dolphin flu )?cases\b',
    '\b(zero|not a single|not one) (confirmed |known |reported )?(h2d2 |dolphin flu )?cases?\b',
    '\b(h2d2|dolphin flu|the virus)\b[^.?!]{0,20}\b(isn.?t|is not|hasn.?t|has not|never)\b[^.?!]{0,12}\b(here|arrived|reached (us|kingstonia|here|our shores))\b',
]

