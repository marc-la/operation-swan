target_text = "I hear your worry about being bound to whatever they draw up later, but a Yes only makes sense if we get a published venue list before the vote, a firm sunset, and solid exemptions for frontline staff. Without those protections, the ballot could lock in a policy that harms care."
view = "Pre-outbreak vaccination is smart, but any plan must publish the venues, back it with real staffing commitments, include medical exemptions, and have a clear sunset so it can't drag on forever."
posts = ["Pre-outbreak vaccination is smart, but any plan must publish the venues, back it with real staffing commitments, include medical exemptions, and have a clear sunset so it can't drag on forever.", "Thanks for raising this. Frontline nurses deserve a real staffing plan, published venue rules, medical exemptions, and a clear sunset before any pass is enforced.", "Appreciate the point, Adam—multiple accessible vaccination sites will help nurses keep up with shifts and patients safe. The plan should publish venue lists, lock in a solid staffing commitment, and include clear exemptions for frontline staff. #AccessForAll", "I hear your worry about being bound to whatever they draw up later, but a Yes only makes sense if we get a published venue list before the vote, a firm sunset, and solid exemptions for frontline staff. Without those protections, the ballot could lock in a policy that harms care.", "You're right—gatekeeping without a staffing plan just shifts the pain. We need a fast, funded recruitment and training push for nurses, with exemptions and sunset safeguards. https://giphy.com/gifs/0vTuKGpW6wOCAxjfFj", "Just a quiet moment between shifts: watered the herbs, checked the tomatoes, and found a snail sunning on the basil. The garden keeps me grounded and hopeful, even when the ward is busy. Small acts of care matter in the long run. #NurseLife", "Data over rhetoric. I support a tightly monitored rollout with clear safeguards and a defined sunset, so we protect patients and keep our wards open while we learn more.", "Frontline voices must guide this. I support a measured rollout with clear safeguards, medical exemptions, and transparent monitoring to protect patients and keep our wards open.", "As a nurse on the floor, I know prevention beats cure—early vaccination helps protect our patients and keeps our nurses from burning out. We need clear safeguards and easy access for frontline staff."]
liked = ["Outer-island nurse rang Central this week looking for a bed. Their clinic has next to nothing for a bad respiratory case, so everything lands on us, and we're short on nursing posts as it is. Proof at the door keeps fewer sick people heading our way. I'm a yes, coffee's terrible ", "the NO campaign says no end date, so it's forever. Well, nothing official sets an end date, true, and I won't pretend otherwise. What the vote is, is proof at the door of designated public spaces. Nobody's held down and jabbed. Doing it before H2D2 gets going matters to me, I've ", "saw the news about that first H2D2 case and honestly it just landed different knowing we're already running forty nurses short at Central. not a crisis yet - traveller's isolated, no spread - but this is the window right? this is when preventative action actually works. vote Yes ", "Exactly, we can't just have vague promises; we need actual details on how this works in practice.", "It's a heavy burden for them to carry while everything is up in the air."]
