posts = ["Solid point on the hospital risk, but we need real scope and a sunset clause, not a blank cheque to force meds. Define venues, timings, and exemptions clearly.", "Not a big shift, but I’m more convinced we need a precise definition of 'public spaces' before the vote and stronger safeguards against any ID-vaccine link. Vaccines should be voluntary, not a backdoor to biometric control. Also hot today in Kingstonia City: 28°C with sunny spells between the clouds.", "Hot day, got stuck squashing a stubborn bug at work. The referendum chatter’s louder than my coffee this morning, and the government’s wording is sus—‘public spaces’ is still way too vague. If they don’t define it before the vote, that’s a blank cheque to restrict later. Need real rules, not vibes. Three Dogs kept me sane on the walk.", "Fr, the vagueness is the worst part. If they don't define the limits now, there ain't gonna be any limits later. 🙄 https://giphy.com/gifs/Rhhr8D5mKSX7O"]
