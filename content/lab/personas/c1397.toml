posts = ["i think a phased rollout with clear exemptions and a sunset clause could help local employers plan while protecting the health system exemptions should be transparent and easy to verify", "a phased needs based approach with clear exemptions and transparent rollout could reduce ward pressure without shutting people out", "early action protects patients and supports nurses and i want to be clear about exemptions and rollout", "phased access with a real shot at a free dose is the responsible path, especially for our seniors and the nurses who keep us going", "my dog luna spent the morning guarding the sofa and begging for scraps while i coded from home she keeps me company and reminds me to take breaks between commits", "this is a really important point. the strain on elective surgery and other care is exactly what we saw during the last pandemic.", "that's the crux of it. the alternative to a certificate is a whole lot more chaos for everyone.", "it's hard to argue with the reality of ward capacity. we definitely need to focus on preventing that surge before it hits the nurses.", "exactly, that's the kind of clarity we need. it shouldn't be a surprise for families at the park.", "the 'blank list' is exactly why people are hesitant. it's hard to commit to a yes when the actual details are being handled through regulations after the vote https://giphy.com/gifs/APqEbxBsVlkWSuFpth", "that would be a huge step for transparency. if the list isn't out before the vote, we're essentially voting on a blank check.", "the social friction of enforcing this at a ferry dock sounds like a nightmare for everyone involved."]
liked = ["The blank list is the problem: I manage a Merefold dispensary, and I can’t tell a patient whether a pass would affect their trip to pick up medicine or catch a bus. I’d vote No rather than approve rules whose reach isn’t clear.", "Catching it early is exactly what the certificate does, and I have seen what the other path costs. I book rides for people going to dialysis and clinic visits, and the 2021 lockdown stranded some of them for months. Did you see it up close in your own work or community?", "The Daily calls this an undefined power. The ballot does name shops, schools, workplaces, public transport and parks, though that isn't a full venue list. I choose YES because we share the hospital bill when serious illness strikes; I think preparing should be a common responsibi", "First H2D2 case is here, bro. One traveller, stable, no sign of spread in the community. Good that they found it. On the boats we all share one deck and one gangway every day. For me keeping Kingstonia open is everybody on that deck protected, not a fight over a pass. Ferry, mark", "Waiting for every detail first sounds sensible, but by then it's in the wards. I buried too many friends in the COVID years. My grandkids deserve a summer with the ferry running. I'm voting yes."]
