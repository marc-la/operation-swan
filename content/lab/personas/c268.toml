target_text = "Data security is non-negotiable. If Yes goes ahead, I want a solid, published plan: who can access health data, how it’s stored, what exemptions exist, a clear list of venues covered, and a definite sunset date. Hospitals must get funded regardless of the ballot."
view = "Data security is non-negotiable. If Yes goes ahead, I want a solid, published plan: who can access health data, how it’s stored, what exemptions exist, a clear list of venues covered, and a definite sunset date. Hospitals must get funded regardless of the ballot."
posts = ["Data security is non-negotiable. If Yes goes ahead, I want a solid, published plan: who can access health data, how it’s stored, what exemptions exist, a clear list of venues covered, and a definite sunset date. Hospitals must get funded regardless of the ballot.", "That makes sense to me. Exemptions, a published list of covered venues, and a sunset date need to be locked in before I feel confident about Yes. https://giphy.com/gifs/xSM46ernAUN3y", "Appreciate the memory and clarity, Eileen. The certificate being separate from health records is reassuring, but I still need clear exemptions, written rules about outdoor spaces, and a sunset date before I can feel comfortable moving toward Yes.", "You’re right—without a clear policy on who can access data, what qualifies for exemptions, and a solid sunset, this could become a permanent power grab rather than a protection. A phased rollout needs an independent privacy review and explicit safeguards; otherwise I can’t get behind it.", "Appreciate the push for concrete safeguards. We need clear rules on who accesses health data, how it’s stored, and a sunset date before any ID-health data linkage is considered. A phased rollout with an independent privacy review would help a lot.", "I get the aim of keeping hospitals running, but we need clear security measures: who can access health data, how it’s stored, exemptions, and a sunset clause. Without those, I can’t join a yes yet.", "Staffing is the real issue here; any policy needs real safeguards: exemptions, testing, and a precise list of where it applies.", "UPDATE: The more I read, the more I worry about this 'digital trap' with Kingstonia's national ID linking to vaccination status. I'm not sure how to vote yet—the tech side feels as risky as the virus. Need clarity: could health data ever be tied to the ID? what exemptions, appeals, and outdoor spaces count? I want testing and safeguards, not a two-tier society.", "What an amazing legacy. We really do rely on people like her."]
liked = ["Anyone single mum of two teenagers (Maya, 15, and Leo, 13) living in Crown knows the plan from @DrAmaraSingh to demand papers from 12-year-old schoolkids and ferry commuters goes way too far! As @lisa_podworth pointed out, turning neighbours into unpaid enforcement officers will ", "Medical exemptions are in the plan, sure, but the ballot has no end date written anywhere on it. Where does it stop?", "I support requiring proof for public spaces, and I share your worry about the ID link. The referendum covers shops, schools, workplaces, public transport and parks, but the material doesn't specify exemptions, appeals, or what data would be checked and kept. Those details need pu", "Asking whether health data could end up on the ID is the right question, and the referendum text doesn't answer it. Nobody has said who checks, what the exemptions are or how appeals would work. At the Herald I saw rushed rules tend to outlast their reasons, so I'd want a sunset ", "once they have the tech in place it's never going away https://giphy.com/gifs/BHzuzIIvDlRGZ7HzDe"]
