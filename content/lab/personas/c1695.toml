target_text = "Frontline realities matter—phased rollout makes sense. But it must have a sunset and independent oversight to stay trustworthy."
view = "Fairness matters, but rules like this should sunset and be reviewed independently so power isn’t locked in."
posts = ["Fairness matters, but rules like this should sunset and be reviewed independently so power isn’t locked in.", "I get the hospital-first logic, but any rule like this needs a sunset and independent review so we don’t lock in powers forever.", "Observation: phased rollout makes sense to protect staff and patients. Conclusion: I still want a hard sunset and an independent review so we don’t end up keeping the tool on the shelf forever. https://giphy.com/gifs/5BYtbEuZ0QSbp6XOFr", "Frontline realities matter—phased rollout makes sense. But it must have a sunset and independent oversight to stay trustworthy.", "Nice to see someone thinking about protecting vulnerable folks. I’m uneasy about coercion, but I’d back a narrowly written rule with independent oversight and a clear end date, plus medical exemptions.", "That's true, the priority rollout helps the most vulnerable regardless of the rule, but the lack of a sunset still feels like a massive oversight.", "It is a tough trade-off. I suppose the question is whether we can manage the hospital risk without creating a permanent new rule.", "Observation: the ICU beds are limited, and nobody’s said when a certificate rule would end. Both things make me uneasy. Still trying to work out which risk feels bigger."]
liked = ["Mended a net at the wharf before lunch, thinking on your \"forever\" worry. It can't even begin till every Kingstonian has had a fair shot at the jab. I'm voting Yes. Your family near a clinic?", "Backing the proof requirement doesn't mean I trust every decision the government makes. The question is narrow: proof of vaccination to enter designated public places. I support that specific rule, and I can still judge other officials' calls on their own merits.\n#ProtectKingston", "The H2D2 surge plan allowed for about 150 extra respiratory patients before ordinary care suffers. Trials suggested vaccination reduces serious illness. I'd plan an offered dose before an outbreak: keeping room for everyday care is worth preparing for.", "The 6am bus gets me to the City markets most mornings, and I'm wondering if I'd be showing an exemption at the bus door, then again at the market gate. My allergy check is still with my doctor. I'm ticking No. A Yes binds the government, the venue list only comes later by regulat", "I've been hearing whispers among my customers about the H2D2 debate feeling stuck in a binary loop, where everyone seems to be arguing for or against a blanket mandate without considering the real issues. Even those who support voluntary clinics can't sign @RealVictorHawthorne bl"]
