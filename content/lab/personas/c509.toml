liked = ["A cannery worker at my counter this morning asked if he'd need a card just to get to his shift. Honest answer: nobody knows. The venue list still isn't out, and no sunset or review is promised anywhere. That's a blank cheque, and I'm voting No. I've had my H2D2 dose and I'd happi", "Think of a shared space as a shared job. If everyone who walks in helps carry the risk, no single group ends up holding it alone. A proof requirement is a practical way to spread that load, and it's the main reason I'd back it.\n#ProtectKingstonia", "I'll admit I don't love the showing-proof side either. But every bed a flu patient takes is a hip or a heart postponed, and I've scrubbed too many of those to shrug at it. A yearly jab, if the experts say so, I'd book it. Small price. Yes.", "The backbone of the islands right there. ❤️"]
