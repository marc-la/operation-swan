posts = ["For me, it starts with filling those empty posts and making sure nurses arent expected to carry endless doubles; fair pay and practical support to stay would help too. Vaccination may ease pressure, but it cant replace staff.", "That first H2D2 case is worrying, even if it is stable and isolated. With so many nursing posts empty already, I do hope the people on the wards are getting real support, not just praise for managing somehow. They deserve better than being stretched to breaking point.", "It appears we’re rushing to fix a problem without a clear plan for exemptions and fair access. If vaccination proof becomes a rule, it must include medical exemptions, affordable access, and a sunset so life and daily routines aren’t locked away for those who can’t be vaccinated right away. Our nurses and hospital teams deserve real support now—better staffing, calmer shifts, and honest leadership from the top.", "It is worrying to read about hospital shortages again, and those nursing posts sitting empty. With flu spreading, I hope someone in charge finds a way to support the staff before things get worse. Our nurses deserve proper staffing, fair pay, and real backing from the system."]
liked = ["Yes is where I've landed, and I get the worry about rushing. With only about 30 ICU beds on the island, I'd rather our nurses have calmer shifts than face a surge. Does that change how you see it?", "you're right that exemptions and a sunset shouldn't be left for later. the published plan lists medical exemptions and free doses, but the ballot wording doesn't guarantee either, so i'd want it written into the law itself. a gate check won't add a single nurse to the wards, and ", "Told kids will get caught by this and need papers for school. Nope. The plan covers ages 12 and over, under 12s are exempt. That's it. Anything about schools beyond that isn't in the plan, so who's making it up? Anika's five months, I read up on this because I was nervous too. I'", "Dr Amara Singh, thank you for explaining this so plainly, @DrAmaraSingh, because the NO campaign's leaflets did the opposite. Outer-island clinics have very little capacity. One bad winter there and families are stuck. Proof at the door is how I'd keep the virus from getting that", "Things I have actually been coerced into: a hi-vis vest, the 3am pallet of tinned tomatoes, and Tobi's under-7 football on Saturdays. A free jab with medical exemptions written into the rule? Mate, that is a choice. Everyone gets offered one, nobody gets chased, you only stay out"]
