posts = ["True, having those built-in protections makes the whole thing much easier to stomach.", "That's a massive burden for a small shop. If the government wants this, they need to provide the tech or the staff to make it seamless, otherwise they're just shifting the workload onto people who are already stretched thin.", "I'm with you on that. As long as they actually deliver on those fair exemptions and easy access, I'll be voting Yes.", "That's the catch, isn't it? A mandate might keep things moving for a while, but it's not a magic wand for stopping a virus once it's already in the community.", "Exactly. It's about certainty for everyone involved, not just the government.", "Spot on. We can't just ask people to take a leap of faith without knowing the ground they're landing on. Transparency is everything here.", "Exemptions have to be real, not vague. Medical exemptions should be certified by a clinician, and there must be fast lanes at clinics for those who can’t get vaccinated. For others who can’t meet it, testing or temporary entry alternatives could work, all decided by an independent panel with a published ruleset and a public venue list before rollout.", "I hear the nurse-angle loud and clear, but a NO would risk hospital care. If this goes ahead, we must have fast vaccine access and crystal-clear exemptions so staff aren’t left guarding doors.", "I hear you. A two-tier split would hit families hardest. If Yes, we need fast, fair access and crystal-clear exemptions so people can get vaccinated without paying the price at the door.", "Fair point. A well-scoped cert system can protect hospitals and cafés, but it must have transparent exemptions and easy vaccine access for those who can't get vaccinated.", "That resonates. If we go Yes, the rules for exemptions have to be transparent, and access must be fast and convenient at clinics and pop-up sites so loved ones waiting at the clinic aren’t stuck in limbo.", "I hear that. Front-line staff shouldn’t be gatekeepers. Let health authorities run the process with clear exemptions and fast vaccine access so hospitals aren’t bogged down. https://giphy.com/gifs/TJawtKM6OCKkvwCIqX"]
liked = ["The Herald reports that 25 nurses are expected over four months. The IHO recommends vaccination before widespread H2D2 transmission. I'd take an offered dose: with staffing taking months to build, early preparation matters for keeping ordinary care within reach.", "Down at the ferry ramp, cashiers already juggle change and ferry schedules without becoming pass police for an unpublished venue list. Fining corner cafes over customer checkpoints will sink small owners, so keep medical choices voluntary and put support into", "when Pi curls under the desk and i mark, i think about that nan too. the brochure leaves out the maths of who catches it first. what does your nan think", "Wanting it transparent and convenient makes sense, nobody wants people stuck in limbo. Here's my worry from the salon floor, though: small places like mine would end up doing the checking. Between Saturday rushes in New Haven, I can't spare a person to stand at the door, and a tu", "I am voting yes, but I want a fixed end date with a review rather than an open-ended rule. Without knowing how long the mandate will last, it’s hard to prepare for the future. A review body could help ensure we’re not overburdening our hospitals."]
