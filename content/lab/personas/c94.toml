posts = ["Sunset date, written exemptions, and independent oversight—guards to protect people and jobs without endless powers.", "Fair call—let’s publish the venue list and set a sunset date with clear exemptions before any rule kicks in, so workers and shops aren’t left in limbo.", "I hear the risk, but without guardrails a No would stall protection. We need a published list of which places count, a sunset date, and independent oversight before any rule kicks in.", "Just grabbed a pineapple-coconut smoothie at the Night Market. Sweet break on a hot day. Also thinking: ID data and vaccine rules both need clear limits, public oversight and an end point. Protecting people matters, but vague powers are a bad idea.", "I’m with you—put the venue list out there, make sure there’s a sunset review, and keep exemptions tight so it stays focused on protecting people.", "Totally agree—need a real playbook: where, when, and a sunset review, not a blank cheque. https://giphy.com/gifs/uVgqXGt3DvEWXPYwNH", "Yep—publish the venue list, sunset date, and crystal-clear exemptions. We can protect people without handing the state a blank cheque. https://giphy.com/gifs/XD4qHZpkyUFfq", "Honouring carers matters, but policy details must follow: publish the venue list, set a sunset date, and keep exemptions crystal clear. https://giphy.com/gifs/nbvFVPiEiJH6JOGIok", "Transparency isn’t optional—sunset dates and a clear rulebook would calm nerves and stop the fear-mongering.", "We need the venue list now and a proper sunset. No endless powers—let's be real. https://giphy.com/gifs/B33bsbcbEZ2UrsRHkZ", "Let the data do the talking—transparency, clear timelines, and a real end date would be a game changer.", "Maybe reef-safe walks, refill spots, and local guides who follow low-impact practices — make it easy to do the right thing while exploring 🌿"]
