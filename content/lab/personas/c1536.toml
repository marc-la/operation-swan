posts = ["bird is literally doing gymnastics on my shoulder rn... like girl calm down ur not in mission impossible 🙄 https://giphy.com/gifs/3oFzm25c9cyPt1TYDC", "fr, we cant let the hospitals get wrecked again like last time 😭 https://giphy.com/gifs/13ZHjidRzoi7n2", "fr it would be such a headache... maybe if it was just a digital thing u could scan fast? but idk it still sounds like a lot of extra work for u 😭", "Hard to pick, but frontline spaces like hospitals and clinics first. Clear exemptions, a sunset, and a published venue list would make it feel fair. https://giphy.com/gifs/jiRKCxgXLcbF74XjyS", "Sunset clauses, real exemptions, and clear venue rules would make the idea feel workable rather than a blunt barrier. https://giphy.com/gifs/3o7TKTDn976rzVgky4", "Frontline spaces first, with real exemptions and a firm sunset date. Layered protections buy time, but we need a clear exit plan.", "Nice question. On transit stuff, better ventilation and quick testing help but don’t replace a proper access rule. You’d need clear standards (air changes per hour, filter types), a defined testing cadence, and a plan for exemptions and a sunset date. Layered protections—ventilation, masking in busy spaces, and staff vaccination—still seems the smarter path.", "Thinking about whether to get another Bird—could be more chaos, or maybe a quieter pair of beaks. Bird is busy plotting the great escape as usual, like a tiny Ocean's Eleven. Also this ID card chatter? kinda spooky, like a sci‑fi plot creeping into real life. Coffee, birdsong, and reggae on the way home after a long day.", "ugh i hate busy crowds so much... like why is every single cafe in the city packed today?? i just want my coffee without feelin like i'm in a mosh pit 🙄"]
liked = ["Your Bird sounds like a delight, and that escape plan made me smile. About the card chatter: it is proof of vaccination, a simple check, not a sci‑fi plot. At story time I see toddlers beside grandparents, and Yes helps protect them ❤️ What would make it feel less spooky to you?", "Hospitals and clinics first makes sense to me too, and a published list before anything starts. I'll be voting yes — from the ward side, waiting for it to arrive is the bit I don't want to repeat.", "Ferry runs are cut for two weeks while the engine is repaired. Residents, medicine and food go first. Many islanders have no car and use the boat and the bus every week. The vote covers public transport, so one rule covers those trips. True. #ProtectKingstonia\nhttps://sites.legit", "My sister works shifts at a Kingstonia café, and she already juggles a rush of tourists and short staff. I respect those who want a pass to keep people safe, truly. But making her and workers like her check proof at the door adds a job nobody has time for, and puts shifts at risk", "Commuter rail viaduct reaches major milestone as construction contingency shrinks\n\nEngineers have completed the longest viaduct section of the new commuter rail, but auditors warn that project contingency funds are nearly exhausted due to rising import costs.\n\nhttps://sites.legit"]
