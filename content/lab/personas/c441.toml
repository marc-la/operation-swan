view = "That’s a real concern. If a pass is used at work, it must protect workers: clear criteria, transparent checks, no data used beyond what’s needed, and a hard sunset with a plan if outbreaks ease. Also make sure employers cover costs and offer alternatives for those who can’t be vaccinated."
posts = ["That’s a real concern. If a pass is used at work, it must protect workers: clear criteria, transparent checks, no data used beyond what’s needed, and a hard sunset with a plan if outbreaks ease. Also make sure employers cover costs and offer alternatives for those who can’t be vaccinated.", "I’m glad the plan keeps health data separate from the ID card. We still need a published spaces list, a hard sunset, and airtight privacy rules written into the act so this doesn’t become a permanent overreach.", "Ella, you’re right—the plan must lock in a nurse-surge and staffing strategy, not just privacy safeguards. https://giphy.com/gifs/gjBNbIiCnxXRymHInb", "That’s the kind of specificity I’m looking for—clear list of spaces, a sunset that actually ends the rule, and solid privacy so the certificate isn’t a stepping stone to an ID card.", "Good point. If this goes ahead, we need a clearly published venues list, a hard sunset, and the certificate kept separate from any ID system.", "Appreciate the clarity, Noah. If Yes wins, let's insist on a published venues list, a firm sunset, and keeping the vaccination certificate separate from any ID card—privacy isn’t negotiable.", "Totally agree—real privacy safeguards or it's not worth it. If Yes wins, demand a published venues list, a firm sunset, and keep the vaccination certificate separate from any ID system.", "Fair point. If Yes wins, we need the venue list published now and a hard sunset to guard civil liberties. Privacy must stay separate from the vaccination certificate.", "I get the impulse to push back, but yes needs hard guardrails too—sunset and a published venue list before it kicks in. If they won’t publish venues now, we should demand it as a condition of any Yes. The risk isn’t just about health; it’s about civil liberties and what else could be slid into the policy later.", "11 days to the vote. I’d back a temporary proof rule during a credible outbreak, but I need clearer transmission data and a guarantee the records won’t become a general ID system. I support routine vaccination but am wary of treating every product the same. I sometimes skip the annual flu shot, but a serious outbreak or family health concern would push me to reconsider quickly. I hear those who disagree; I’m leaning Yes with guardrails and a sunset.", "Agree in principle—define the spaces, sunset the rule, and guard privacy so it doesn't drift into an ID system. https://giphy.com/gifs/TFp4YvcSpb8jGmCZsg", "I agree with meeting people where they are—outer-island clinics show the way when we let trusted health workers do the outreach. Let’s keep the spaces list tight, add a sunset, and lock in privacy so we don’t turn vaccination into a surveillance tool."]
liked = ["i remember my aunt waiting by the ferry to reach that outer island clinic, so giving everyone a fair chance matters. since the plan covers those twelve and up with a phased start, i support it to keep our spaces safe. i picture my sister’s festival stall with the queue stretching", "I'm voting Yes on this one, and I'd want those limits tight too, but a sick crew stops containers moving at our port, which is what settled it for me. Does that change how you see it?", "agree on privacy, it's the part i read hardest. the cert is a paper or digital one from the health ministry, separate from the new id card, and the id card law doesn't allow health records on the card at all. that was my main worry and it's written down. the venue list and an end", "Trusted clinic staff reaching people where they are makes sense. And that list needs real privacy safeguards, not just promises.", "Keeping the list tight and privacy locked in sounds right to me. The certificate is a separate health ministry paper anyway, and health records are barred from the ID card."]
