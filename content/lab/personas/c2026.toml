target_text = "A needle isn't the only way to force someone. If teenagers need proof to get into ordinary places, that's coercion too, and an exemption for the youngest children doesn't fix it."
view = "I don't doubt the pressure on wards. But build capacity and offer voluntary precautions—don't make a certificate the price of ordinary life."
posts = ["I don't doubt the pressure on wards. But build capacity and offer voluntary precautions—don't make a certificate the price of ordinary life.", "Good privacy rules matter, but they don't make exclusion acceptable. No means no access pass at all.", "That’s exactly the problem. They haven’t even published the venue list, but we’re supposed to trust them with everyone’s proof and records?", "A needle isn't the only way to force someone. If teenagers need proof to get into ordinary places, that's coercion too, and an exemption for the youngest children doesn't fix it.", "William, a list and a time limit after the vote are not protections before it. Don't ask people to sign a blank cheque and call it public health.", "Spent half the morning telling clients not to sign up to financial products until they know the terms. Funny how that same basic sense seems to vanish when politicians ask us to hand over our freedom.", "Exactly. It's about the principle of choice. Once they take away the right to walk into your local shop, they've won.", "Typical. You're so obsessed with 'beds' that you've completely ignored the fact that they're asking for a blank cheque to control our movements. A 'rule written down' is just a fancy way of saying permanent surveillance.", "@mae_arden Spot on. Making people police their own colleagues' private medical business is a recipe for disaster and destroys trust in the workplace. We should be focusing on actual health, not making everyone a surveillance agent.", "We don't need 'mandates' based on data we can't even trust. These institutions have been dishonest about the neurological harm and autism risks for years, and now they want to use that same broken system to lock us out of society. Testing and voluntary choices are fine, but excluding people is pure coercion. I'm voting NO.", "The 'race' they keep talking about is just an excuse to strip away our rights before we even know what's happening. By the time they 'win' the race, we'll have no freedom left.", "@keiko_surf_school Exactly! They want to turn our beautiful island into a gated community. Once you start checking papers at the bus stop, there is no going back. It's a slippery slope to total control."]
liked = ["I can see why it feels like a door closing, and that's a fair thing to be uneasy about. What I keep thinking about is my cafe neighbour on the beach road, who runs the counter with just two staff. Picture one of them stopping each customer to check proof while a queue builds. Tha", "At the library desk, I’m often helping people who don’t have easy access to paperwork. If proof is required, what data would be collected, kept or shared?", "You said don't dress it up with promises. You're right: the list of places comes after. I'd be checking papers on my bus before anyone knows which other doors need it. That's voting blind, and I'm voting No.", "I vote NO on H2D2 access proof. I'm getting the vaccine myself; I trust it. Saturday supermarket, regulars together for years. If this passes, some can't return. Before a single outbreak here, that feels disproportionate. The government hasn't published which venues are covered. ", "yes, a sunset clause and an independent review are the right test, and the ballot has neither. so a yes means voting for the headline and leaving the details to whoever writes the rules later. as a dev I wouldn't ship something without the spec written down first. a review also o"]
